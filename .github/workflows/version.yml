name: Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: version-pr-main
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: changesets
        run: |
          if [[ -n "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)" ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changesets.outputs.pending == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - id: registry
        if: steps.changesets.outputs.pending == 'true'
        run: node scripts/release.mjs version-pr
      - if: steps.registry.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.registry.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.registry.outputs.ready == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version:packages
          pr-base-branch: main
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
