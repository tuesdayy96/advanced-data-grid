name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact library version to publish from main
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Check registry and remote tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs check "$RELEASE_VERSION"
          tag_ref=$(git ls-remote --tags origin "refs/tags/v$RELEASE_VERSION")
          if [[ -n "$tag_ref" ]]; then
            echo "::error::Tag v$RELEASE_VERSION already exists."
            exit 1
          fi

  ci:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  pack:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - name: Create verified tarball and release notes
        run: |
          mkdir release
          node scripts/check-package.mjs "$PWD/release"
          node scripts/release.mjs notes "$RELEASE_VERSION" release/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.run_id }}
          path: release
      - name: Verify runtime and publish approved tarball
        run: |
          node --version
          npm --version
          node -e 'const [major,minor,patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$(npm --version)"
          node scripts/release.mjs publish "$RELEASE_VERSION" "$PWD/release/advanced-data-grid-react-data-grid-$RELEASE_VERSION.tgz"

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.run_id }}
          path: release
      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RELEASE_VERSION"
          remote_refs=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -n "$remote_refs" ]]; then
            target=$(printf '%s\n' "$remote_refs" | tail -n 1 | cut -f 1)
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag points to $target, expected $GITHUB_SHA."
              exit 1
            fi
            if gh release view "$tag" >/dev/null; then
              echo "Release $tag already exists."
              exit 0
            fi
            gh release create "$tag" --verify-tag --title "$tag" --notes-file release/notes.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release/notes.md
          fi
